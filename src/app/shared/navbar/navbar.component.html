<header class="navbar">
  <a routerLink="/" routerLinkActive='activo' [routerLinkActiveOptions]="{exact:true}" class="logo">🏋️ MiGym</a>

  <nav>
    <a routerLink="/clases">Clases</a>

    @if(authService.esUser()){
      <a>Mis Clases</a>
    }

    @if(authService.esAdmin()){
      <a>Administrar Clases</a>
      <a>Usuarios</a>
    }
    
  </nav>

  <div class="sesion"> // Nombre del usuario + rol + logout ó login
    @if(!authService.usuario()){
      <a>Ingresar</a>
    }@else {
      <p>@{{authService.usuario()?.nombre}}</p>
      <p>{{authService.usuario()?.rol}}</p>
      <a>Salir</a>
    }

  </div>
</header>
